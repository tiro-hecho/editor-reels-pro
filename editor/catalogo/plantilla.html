<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITULO__</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;700;900&family=Montserrat:wght@800&family=Playfair+Display:ital,wght@1,700&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0f;--p:#17171a;--p2:#202024;--t:#f4f4f5;--s:#a1a1aa;--l:#2a2a2f;--a:#ffd60a;--ok:#34c759;--pr:#ff9f0a;--rf:#8e8e93}
:root[data-theme=light]{--bg:#f5f4f0;--p:#fff;--p2:#efede8;--t:#141414;--s:#5f5f66;--l:#e2e0da;--ok:#1f9d55;--pr:#c26a00;--rf:#6b6b70}
[hidden]{display:none!important}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 -apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
button,select,input{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--l)}
.hd{max-width:1400px;margin:0 auto;padding:16px 16px 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{margin:0;font-size:24px;letter-spacing:-.02em;font-weight:900}h1 b{color:var(--a)}
.tabs{display:flex;gap:4px;background:var(--p);border:1px solid var(--l);border-radius:12px;padding:4px;margin-left:auto}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--s)}.tabs button.on{background:var(--a);color:#111}
.th{border:1px solid var(--l);background:var(--p);border-radius:10px;padding:8px 10px;cursor:pointer}
.fil{margin-top:12px;display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}.fil>.row{min-width:0;flex-wrap:nowrap}.fil>.row:first-child{flex-wrap:wrap}
.lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--s);min-width:96px}
.chips{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--l);background:var(--p);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:var(--t);color:var(--bg);border-color:var(--t)}.chip .n{opacity:.55;font-weight:500;margin-left:4px}
input[type=search],select{background:var(--p);border:1px solid var(--l);border-radius:10px;padding:8px 12px}
input[type=search]{flex:1 1 220px}
main{max-width:1400px;margin:0 auto;padding:16px}
.sec{margin:8px 0 26px}.sec h2{font-size:18px;margin:0 0 12px;display:flex;gap:8px;align-items:baseline}.sec h2 span{color:var(--s);font-size:13px;font-weight:500}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.card{background:var(--p);border:1px solid var(--l);border-radius:18px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:var(--a)}
.ph{position:relative;aspect-ratio:9/16;overflow:hidden;background:#111;isolation:isolate}
.ph .num{position:absolute;top:8px;left:8px;z-index:9;background:var(--a);color:#111;font-weight:900;border-radius:8px;padding:1px 9px;font-size:16px}
.ph .est{position:absolute;top:9px;right:8px;z-index:9;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:rgba(0,0,0,.6);border-radius:999px;padding:3px 8px}
.est.aprobado{color:#4ade80}.est.pruebas{color:#fbbf24}.est.referencia{color:#d4d4d8}.est.rechazado{color:#f87171}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}.cb h3{margin:0;font-size:14px;line-height:1.25}.cb p{margin:0;font-size:12.5px;color:var(--s);line-height:1.35}
.tag{font-size:11px;color:var(--s)}.tag b{color:var(--t)}
/* portadas: tira de 3 fotogramas */
.vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:8;opacity:0;transition:opacity .3s;background:#000}.card:hover .vid.ok{opacity:1}.play{position:absolute;bottom:8px;left:8px;z-index:9;font-size:10px;font-weight:800;background:rgba(0,0,0,.65);color:#fff;border-radius:999px;padding:3px 8px}
.tira img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}.tira img.on{opacity:1}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:0 50%;animation:pan 14s ease-in-out infinite alternate}@keyframes pan{from{object-position:0 50%}to{object-position:100% 50%}}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12) translateY(-2%)}}
/* portadas: muestra animada */
.dm{position:absolute;inset:0;overflow:hidden;font-family:"Helvetica Neue",Inter,Arial,sans-serif}
.dm .sil{position:absolute;left:50%;bottom:-2%;width:78%;transform:translateX(-50%);z-index:2}
.dm .z1{z-index:1}.dm .z3{z-index:3}
.dm *{animation-fill-mode:both}
.go .up{animation:up .5s cubic-bezier(.2,.9,.3,1.3) both}.go .fd{animation:fd .5s ease both}.go .pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.go .sl{animation:sl .5s cubic-bezier(.2,.9,.3,1) both}.go .sr{animation:sr .5s cubic-bezier(.2,.9,.3,1) both}.go .dn{animation:dn .55s cubic-bezier(.2,.9,.3,1.1) both}
.go .gr{animation:gr .7s cubic-bezier(.2,.9,.3,1) both;transform-origin:left}.go .fly{animation:fly 2.6s cubic-bezier(.6,0,.4,1) both}
.go .bl{animation:bl .6s ease both}.go .orb{animation:orb 6s linear infinite}.go .glow{animation:glow 1.6s ease-in-out infinite alternate}
.go .drw{animation:drw 1.4s ease both}
@keyframes up{from{opacity:0;transform:translateY(40%) scale(.9);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes fd{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes sl{from{opacity:0;transform:translateX(-60%)}to{opacity:1;transform:none}}@keyframes sr{from{opacity:0;transform:translateX(60%)}to{opacity:1;transform:none}}
@keyframes dn{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}@keyframes gr{from{transform:scaleX(0)}to{transform:none}}
@keyframes fly{0%,45%{transform:none;opacity:1}70%{transform:translateX(160%);opacity:0}100%{transform:translateX(160%);opacity:0}}
@keyframes bl{from{opacity:0;filter:blur(10px);color:#777}to{opacity:1;filter:none}}@keyframes orb{to{transform:rotate(360deg)}}
@keyframes glow{from{text-shadow:0 0 6px currentColor}to{text-shadow:0 0 22px currentColor,0 0 2px #fff}}@keyframes drw{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
/* ficha */
dialog{border:0;padding:0;border-radius:20px;background:var(--p);color:var(--t);width:min(980px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.7)}
.fi{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:0}.fi .ph{border-radius:0}
.fi .tx{padding:22px;display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:92vh}
.fi h2{margin:0;font-size:24px}.fi .x{position:absolute;top:10px;right:12px;border:0;background:var(--p2);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:18px}
.big{width:100%}.big img{width:100%;border-radius:12px;border:1px solid var(--l);cursor:zoom-in}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.kv b{color:var(--s);font-weight:600}
.cta{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:var(--a);color:#111}.btn.s{background:var(--p2);color:var(--t)}
code{background:var(--p2);border-radius:6px;padding:1px 6px;font-size:12.5px;word-break:break-all}
@media (max-width:700px){.fi{grid-template-columns:1fr}.fi .ph{max-height:60vh;aspect-ratio:auto;height:60vh}.lbl{min-width:0}}
/* visor de subtítulos */
.vs{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:24px;align-items:start}
.vs .stage{position:sticky;top:90px}.vs .ph{border-radius:28px;border:6px solid #000;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.ctl{display:grid;gap:14px}.grp{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:14px}.grp h4{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--s)}
.pres{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pre{border:1px solid var(--l);background:var(--p2);border-radius:12px;padding:8px;cursor:pointer;text-align:left}.pre.on{border-color:var(--a);box-shadow:0 0 0 2px var(--a) inset}
.pre b{display:block;font-size:13px}.pre small{color:var(--s);font-size:11px}
.opts{display:flex;flex-wrap:wrap;gap:6px}.opt{border:1px solid var(--l);background:var(--p2);padding:7px 11px;border-radius:10px;cursor:pointer;font-size:13px}.opt.on{background:var(--a);color:#111;border-color:var(--a);font-weight:800}
.rng{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;font-size:13px}input[type=range]{accent-color:var(--a)}
.out{font-size:13px;background:var(--p2);border-radius:10px;padding:10px;white-space:pre-wrap}
@media (max-width:820px){.vs{grid-template-columns:1fr}.vs .stage{position:static;max-width:320px;margin:0 auto}}
/* subtítulos en pantalla */
.sub{position:absolute;left:6%;right:6%;z-index:6;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:0 .28em;text-align:center;line-height:1.02}
.sub .w{display:inline-block;will-change:transform,filter,opacity}.sub .ln{display:inline-block;overflow:hidden;padding:0 .02em .08em}
.w.muelle{animation:sMu .5s cubic-bezier(.3,1.7,.5,1) both}@keyframes sMu{from{opacity:0;transform:translateY(.45em) scale(.9);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.w.mascara{animation:sMa .28s cubic-bezier(.2,.9,.3,1) both}@keyframes sMa{from{transform:translateY(105%);filter:blur(5px)}to{transform:none;filter:none}}
.w.subir{animation:sSu .25s ease-out both}@keyframes sSu{from{opacity:0;transform:translateY(.3em);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.w.pop{animation:sPo .35s cubic-bezier(.3,1.8,.5,1) both}@keyframes sPo{from{opacity:0;transform:scale(1.35)}to{opacity:1;transform:none}}
.w.desenfoque{animation:sDe .22s ease-out both}@keyframes sDe{from{opacity:0;filter:blur(12px);transform:scale(.89)}to{opacity:1;filter:none;transform:none}}
.w.fundido{animation:fd .2s ease both}
.w.karaoke,.w.gris{opacity:.34;transition:opacity .15s,filter .15s,color .15s}.w.gris{opacity:.3;filter:blur(2px);color:#bbb!important}.w.lit{opacity:1;filter:none}.w.gris.lit{color:inherit!important}
.w.letras .ch{display:inline-block;animation:sSu .18s ease-out both}
</style></head><body>
<header><div class="hd">
<div class="row"><h1>__TITULO_HTML__</h1>
<div class="tabs"><button data-tab="estilos" class="on">Estilos de vídeo</button><button data-tab="subs">Subtítulos</button></div>
<button class="th" id="tema" title="Claro / oscuro">◐</button></div>
<div class="fil" id="filE">
<div class="row"><input type="search" id="q" placeholder="Busca: ranking, mitos, podcast, inmobiliaria…"><select id="ord">
<option value="rec">Orden: recomendados primero</option><option value="num">Orden: por número</option><option value="est">Orden: aprobados → pruebas → referencias</option><option value="nom">Orden: A-Z</option></select>
<select id="agr"><option value="p">Agrupar: para quién (los tuyos primero)</option><option value="g">Agrupar: por lo que vas a contar</option><option value="c" class="soloc">Agrupar: por cliente</option><option value="">Sin agrupar</option></select></div>
<div class="row"><span class="lbl">Para quién</span><div class="chips" id="cP"></div></div>
<div class="row"><span class="lbl">Qué cuentas</span><div class="chips" id="cG"></div></div>
<div class="row soloc"><span class="lbl">Cliente</span><div class="chips" id="cC"></div></div>
<div class="row"><span class="lbl">Estado</span><div class="chips" id="cE"></div></div>
</div></div></header>
<main><div id="vE"></div><div id="vS" hidden></div></main>
<dialog id="dlg"></dialog>
<script>
const D=__DATOS__;
const G={'si-quieres':'«Si quieres X, haz Y»','listas':'Top, rankings y listas','mal-bien':'Mal / bien y mitos','tecnica':'Corregir un ejercicio','vender':'Vender un servicio o producto','consejos':'Opinión y consejos','historia':'Contar una historia','sin-grabar':'Sin grabarte (voz en off)','podcast':'Podcast y entrevista','avisos':'Locales, inmuebles y avisos','horizontal':'Horizontal (YouTube, VSL)'};
const P={'entrenadores':'Entrenadores y gimnasios','negocios':'Negocios locales','marca':'Marca personal y servicios','podcast':'Podcast y entrevistas'};
const E={'aprobado':'Aprobado','pruebas':'En pruebas','referencia':'Referencia','rechazado':'Rechazado'};
const PUB=D.publico||'entrenadores';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let F={q:'',p:'',g:'',c:'',e:''};
try{const t=localStorage.getItem('tema');if(t)document.documentElement.dataset.theme=t}catch(e){}
$('#tema').onclick=()=>{const r=document.documentElement,n=r.dataset.theme==='light'?'dark':'light';r.dataset.theme=n;try{localStorage.setItem('tema',n)}catch(e){}};
if(!D.clientes||!D.clientes.length)document.querySelectorAll('.soloc').forEach(x=>x.remove());
/* ---------- silueta y escenas de muestra ---------- */
const SIL=(c='#2b2b30')=>`<svg class="sil" viewBox="0 0 200 230"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="#0c0c0e"/></linearGradient></defs><ellipse cx="100" cy="62" rx="34" ry="42" fill="url(#sg)"/><path d="M18 230 C22 150 55 118 100 116 C145 118 178 150 182 230Z" fill="url(#sg)"/></svg>`;
const BG={sala:'linear-gradient(180deg,#5b6470 0%,#3a4048 55%,#22262b 100%)',gym:'linear-gradient(180deg,#3b3f45 0%,#26292d 60%,#141518 100%)',calido:'linear-gradient(180deg,#b9805f,#6a3f2b 60%,#2c1a12)',azul:'linear-gradient(180deg,#7fb3e6,#3d6f9e 60%,#1d3550)',oscuro:'linear-gradient(180deg,#26262b,#111113)',claro:'linear-gradient(180deg,#f2f0ea,#d9d5cc)',violeta:'linear-gradient(180deg,#5d4a9c,#2d2350)',noche:'radial-gradient(circle at 50% 30%,#1f3d7a,#070b1a 70%)'};
function d(i,base=0.25,paso=.32){return `animation-delay:${(base+i*paso).toFixed(2)}s`}
const T=(x,y,txt,st='',cls='up',dl='')=>`<div class="z3 ${cls}" style="position:absolute;left:${x}%;top:${y}%;${st};${dl}">${txt}</div>`;
const W='color:#fff;font-weight:800';
const DEMOS={
 barras:o=>{let h=T(8,52,'SI QUIERES',W+';font:900 9px/1 Anton,Impact;letter-spacing:.04em','fd')+T(54,52,'HAZ ESTO',`color:#ef4444;font:900 9px/1 Anton,Impact;letter-spacing:.04em`,'fd');
   ['Clientes','Seguidores','Ventas'].forEach((t,i)=>{h+=`<div class="z3 gr" style="position:absolute;left:8%;width:40%;top:${57+i*7}%;height:5.5%;${d(i,.1,.08)}"><div class="fly" style="background:#22c55e;border-radius:4px;width:100%;height:100%;${d(i,.6,.5)}"></div></div><div class="z3 fd" style="position:absolute;left:10%;top:${57.6+i*7}%;${W};font-size:8px;${d(i,1.5,.5)}">${t}</div>`;
   h+=`<div class="z3 gr" style="position:absolute;left:52%;width:40%;top:${57+i*7}%;height:5.5%;${d(i,.14,.08)}"><div class="fly" style="background:#ef4444;border-radius:4px;width:100%;height:100%;${d(i,.75,.5)}"></div></div><div class="z3 fd" style="position:absolute;left:54%;top:${57.6+i*7}%;${W};font-size:8px;${d(i,1.65,.5)}">${['Enseña casos','Habla a cámara','Responde dudas'][i]}</div>`});return h},
 detras:o=>`<div class="z1 up" style="position:absolute;left:0;right:0;top:${o.y||22}%;text-align:center;font:900 ${o.s||46}px/0.9 ${o.f||"Anton,Impact"};color:${o.c||"#fff"};letter-spacing:-.01em;${d(0)}">${o.txt||"FUERZA"}</div>`+T(0,74,`<div style="width:100%;text-align:center">${o.sub||'sin perder técnica'}</div>`,W+';width:100%;font-size:10px','up',d(2)),
 lista:o=>[1,2,3].map(i=>T(10,22+i*12,`<span style="color:${o.c||'#ffd60a'};font:900 22px/1 Anton,Impact">${i}</span>&nbsp; ${['Calienta','No rebotes','Controla'][i-1]}`,W+';font-size:10px;display:flex;align-items:center','sl',d(i))).join(''),
 ranking:o=>[5,4,3,2,1].map((n,i)=>T(8,14+i*9,`${n} <span style="display:inline-block;width:16px;height:16px;border-radius:50%;border:1.5px ${n==1?'solid #f5c542':'dashed #fff8'};vertical-align:middle;margin-left:4px"></span>`,W+';font-size:10px','pop',d(i,.2,.25))).join(''),
 malbien:o=>T(0,18,'<div style="text-align:center;width:100%">MAL</div>','width:100%;font:900 52px/1 Anton,Impact;color:#ef4444','up',d(0))+T(0,18,'<div style="text-align:center;width:100%">BIEN</div>','width:100%;font:900 52px/1 Anton,Impact;color:#22c55e','up','animation-delay:1.9s'),
 medidor:o=>`<div class="z3 fd" style="position:absolute;left:12%;right:12%;top:20%;height:6px;border-radius:9px;background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e);${d(0)}"></div>`+T(14,26,'malo · bueno · <b style="color:#22c55e">perfecto</b>',W+';font-size:9px','up',d(1))+`<div class="z3 sl" style="position:absolute;left:78%;top:17.5%;width:10px;height:14px;background:#fff;border-radius:3px;${d(2)}"></div>`,
 marcador:o=>T(10,14,'<span style="background:#22c55e;color:#fff;padding:3px 6px;border-radius:4px">FUNCIONA</span>','font:900 9px Anton,Impact','dn',d(0))+T(52,14,'<span style="background:#ef4444;color:#fff;padding:3px 6px;border-radius:4px">NO FUNCIONA</span>','font:900 9px Anton,Impact','dn',d(1))+[0,1,2].map(i=>`<div class="z3 pop" style="position:absolute;left:${14+i*10}%;top:22%;width:16px;height:16px;border-radius:50%;background:#ddd;border:2px solid #22c55e;${d(i,1,.3)}"></div>`).join(''),
 orbita:o=>`<div class="z3 orb" style="position:absolute;left:50%;top:30%;width:0;height:0">${['#1877f2','#e1306c','#25d366','#000'].map((c,i)=>`<div style="position:absolute;width:20px;height:20px;border-radius:6px;background:${c};transform:rotate(${i*90}deg) translate(52px) rotate(-${i*90}deg)"></div>`).join('')}</div>`+T(0,72,`<div style="text-align:center;width:100%">las <b style="color:${o.c||'#c6f432'}">apps</b> que uso</div>`,W+';width:100%;font-size:11px','up',d(1)),
 split:o=>`<div class="z3 dn" style="position:absolute;inset:0 0 50% 0;background:${o.c||'#c26a4a'};${d(0)}"></div>`+T(0,20,`<div style="text-align:center;width:100%">${o.txt||'Dormir mejor'}</div>`,`width:100%;font:700 italic 20px/1 "Playfair Display",Georgia;color:#fff`,'up',d(1)),
 cristal:o=>[0,1].map(i=>`<div class="z3 sr" style="position:absolute;left:${16+i*8}%;right:${16-i*8}%;top:${50+i*14}%;padding:8px;border-radius:12px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.4);${W};font-size:9px;${d(i,.3,.5)}">${['Seguro de hogar','Desde el primer día'][i]}</div>`).join(''),
 serif:o=>T(8,18,`entrevista a`,`color:#fff;font-size:9px`,'up',d(0))+T(8,23,`<i>la fundadora</i>`,`color:${o.c||'#ff8a3d'};font:700 italic 22px/1 "Playfair Display",Georgia`,'up',d(1)),
